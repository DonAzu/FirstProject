<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arbeitszeitrechner</title>
  <meta name="theme-color" content="#1f6feb">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5c6670;
      --border: #d5dbe3;
      --accent: #1f6feb;
      --accent-text: #ffffff;
      --result-bg: #e8f0fe;
      --stop: #d73a49;
      --plus: #1a7f37;
      --minus: #d73a49;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216;
        --card: #191d23;
        --text: #e8ecf1;
        --muted: #9aa4af;
        --border: #2c333c;
        --accent: #4c8dff;
        --accent-text: #0f1216;
        --result-bg: #1a2638;
        --stop: #f0606d;
        --plus: #4ac26b;
        --minus: #f0606d;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: max(24px, env(safe-area-inset-top)) 16px 24px;
    }
    main { max-width: 420px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 8px 0 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 20px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
    }
    .row + .row { border-top: 1px solid var(--border); }
    label { font-size: 1.05rem; }
    label small { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
    input {
      width: 7.5rem;
      font: inherit;
      font-size: 1.4rem;
      font-variant-numeric: tabular-nums;
      text-align: center;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 6px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    input.invalid { border-color: #d73a49; outline-color: #d73a49; }
    .result {
      margin-top: 20px;
      background: var(--result-bg);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
    }
    .result .label { color: var(--muted); font-size: 1rem; }
    .result .time {
      font-size: 3.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
      margin-top: 4px;
    }
    .result .note { color: var(--muted); font-size: 0.9rem; min-height: 1.2em; }

    /* Dini */
    .dini {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
    }
    .dini svg {
      flex: none;
      width: 90px;
      height: 60px;
      shape-rendering: crispEdges;
    }
    .bubble {
      position: relative;
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    .bubble::before {
      content: "";
      position: absolute;
      left: -7px;
      top: 50%;
      width: 12px;
      height: 12px;
      background: var(--card);
      border-left: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      transform: translateY(-50%) rotate(45deg);
    }
    .bubble .say { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .bubble .sub { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }

    /* Buttons */
    button {
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
    .btn-wide {
      display: block;
      width: 100%;
      margin-top: 20px;
      font-size: 1.1rem;
      color: var(--accent-text);
      background: var(--accent);
      padding: 14px;
    }
    .btn-secondary {
      margin-top: 12px;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--border);
    }
    .btn-small {
      width: 7.5rem;
      font-size: 1.1rem;
      color: var(--accent-text);
      background: var(--accent);
      border-radius: 10px;
      padding: 10px 6px;
    }
    .btn-small.running { background: var(--stop); color: #fff; }

    /* Reiter */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .tabs button {
      flex: 1;
      font-size: 1rem;
      padding: 10px;
      color: var(--muted);
      background: transparent;
      border-radius: 10px;
    }
    .tabs button[aria-selected="true"] { color: var(--accent-text); background: var(--accent); }

    /* Woche */
    .plus { color: var(--plus); }
    .minus { color: var(--minus); }
    .week .idx { font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .week .row.sum { border-top-width: 2px; }
    .week .sum-value {
      width: 7.5rem;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .hint { color: var(--muted); font-size: 0.85rem; margin: 12px 4px 0; }
    .version { text-align: center; margin-top: 20px; font-size: 0.75rem; }
  </style>
</head>
<body>
<main>
  <h1>Arbeitszeitrechner</h1>

  <nav class="tabs" role="tablist">
    <button id="tabToday" role="tab" aria-selected="true" aria-controls="pageToday" type="button">Heute</button>
    <button id="tabWeek" role="tab" aria-selected="false" aria-controls="pageWeek" type="button">Woche</button>
  </nav>

  <section id="pageToday" role="tabpanel">
  <div class="card">
    <div class="row">
      <label for="arrival">Ankunft</label>
      <input id="arrival" type="time" required>
    </div>
    <div class="row">
      <label for="work">Arbeitszeit<small>Std:Min</small></label>
      <input id="work" type="text" inputmode="numeric" autocomplete="off" placeholder="8:00">
    </div>
    <div class="row">
      <label for="pause">Pause<small>Std:Min</small></label>
      <input id="pause" type="text" inputmode="numeric" autocomplete="off" placeholder="0:45">
    </div>
    <div class="row">
      <label for="pauseBtn">Pause messen<small id="pauseInfo"></small></label>
      <button id="pauseBtn" class="btn-small" type="button">Start</button>
    </div>
  </div>

  <button id="reset" class="btn-wide" type="button">Check In</button>

  <div class="result">
    <div class="label">Gehzeit</div>
    <div class="time" id="leave">--:--</div>
    <div class="note" id="note"></div>
  </div>

  <div class="dini">
    <svg id="diniIcon" viewBox="0 0 18 12" role="img" aria-label="Dini, ein kleiner orangener Langhals-Dino"></svg>
    <div class="bubble" aria-live="polite">
      <div class="say" id="diniSay">…</div>
      <div class="sub" id="diniSub"></div>
    </div>
  </div>
  <button id="checkout" class="btn-wide btn-secondary" type="button">Check Out</button>
  <p class="hint version">Version v4</p>
  </section>

  <section id="pageWeek" role="tabpanel" hidden>
    <div class="card week">
      <div class="row sum" id="sumRow">
        <span class="idx">Summe</span>
        <div id="weekSum" class="sum-value">0:00</div>
      </div>
    </div>
    <p class="hint">Einträge lassen sich bearbeiten: z. B. +0:15 oder -0:30. Leeres Feld = kein Eintrag.</p>
    <button id="weekReset" class="btn-wide" type="button">Reset</button>
  </section>
</main>

<script>
  const DEFAULT_WORK = '8:00';
  const DEFAULT_PAUSE = '0:45';
  const KEY = 'arbeitszeitrechner';

  const $arrival = document.getElementById('arrival');
  const $work = document.getElementById('work');
  const $pause = document.getElementById('pause');
  const $leave = document.getElementById('leave');
  const $note = document.getElementById('note');
  const $pauseBtn = document.getElementById('pauseBtn');
  const $pauseInfo = document.getElementById('pauseInfo');
  const $diniSay = document.getElementById('diniSay');
  const $diniSub = document.getElementById('diniSub');

  const pad = n => String(n).padStart(2, '0');
  const fmt = mins => `${Math.floor(mins / 60)}:${pad(mins % 60)}`;
  const fmtHHMM = mins => `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`;
  const clock = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const nowHHMM = () => clock(new Date());

  // Pausenmessung
  let pauseStart = null;      // Zeitstempel (ms) der laufenden Pause, sonst null
  let lastPause = null;       // { start, stop, mins } der zuletzt gemessenen Pause
  let pauseMeasured = false;  // erste Messung ersetzt den Standardwert, weitere werden addiert

  // Gehzeit in Minuten ab Mitternacht des Ankunftstags (kann > 1440 sein)
  let leaveTotal = null;

  // "8:00", "8", "0:45", "845" (=8:45), "45" wird als Stunden gelesen -> nur bis 24 plausibel
  function parseDuration(str) {
    str = str.trim().replace(/[.,]/, ':');
    let m = str.match(/^(\d{1,2}):(\d{1,2})$/);
    if (m) {
      const h = +m[1], min = +m[2];
      return min < 60 ? h * 60 + min : null;
    }
    m = str.match(/^(\d{1,2})$/);
    if (m) return +m[1] <= 24 ? +m[1] * 60 : null;
    m = str.match(/^(\d{1,2})(\d{2})$/);   // 845 -> 8:45, 0045 -> 0:45
    if (m && +m[2] < 60) return +m[1] * 60 + +m[2];
    return null;
  }

  function parseTime(str) {
    const m = /^(\d{2}):(\d{2})/.exec(str);
    return m ? +m[1] * 60 + +m[2] : null;
  }

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        arrival: $arrival.value, work: $work.value, pause: $pause.value,
        pauseStart, lastPause, pauseMeasured
      }));
    } catch {}
  }

  function calc() {
    const a = parseTime($arrival.value);
    const w = parseDuration($work.value);
    const p = parseDuration($pause.value);
    $work.classList.toggle('invalid', w === null);
    $pause.classList.toggle('invalid', p === null);

    if (a === null || w === null || p === null) {
      leaveTotal = null;
      $leave.textContent = '--:--';
      $note.textContent = 'Bitte gültige Werte eingeben';
    } else {
      leaveTotal = a + w + p;
      const day = Math.floor(leaveTotal / 1440);
      const t = leaveTotal % 1440;
      $leave.textContent = `${pad(Math.floor(t / 60))}:${pad(t % 60)}`;
      $note.textContent = day > 0 ? `+${day} Tag` : '';
    }
    updateDini();
  }

  // Aktuelle Minute relativ zur Mitternacht des Ankunftstags
  function minutesNow(now) {
    let n = now.getHours() * 60 + now.getMinutes();
    const a = parseTime($arrival.value);
    const crossed = a !== null && a - n > 12 * 60;   // seit der Ankunft ist Mitternacht vorbei
    if (crossed) n += 1440;
    return { n, crossed };
  }

  // Countdown: wird bei Eingabeänderungen, Check-out und beim Zurückkehren in die App neu berechnet
  function updateDini() {
    const now = new Date();
    const stand = `Stand ${clock(now)}`;
    if (leaveTotal === null) {
      $diniSay.textContent = 'Dini wartet auf gültige Werte …';
      $diniSub.textContent = stand;
      return;
    }
    const diff = leaveTotal - minutesNow(now).n;
    if (diff > 0) {
      $diniSay.textContent = `In ${fmtHHMM(diff)} ist Dini-Zeit!`;
      $diniSub.textContent = stand;
    } else {
      $diniSay.textContent = 'Es ist Dini-Zeit!';
      $diniSub.textContent = diff < 0 ? `+${fmtHHMM(-diff)} drüber · ${stand}` : stand;
    }
  }

  function renderPause() {
    const running = pauseStart !== null;
    $pauseBtn.textContent = running ? 'Stopp' : 'Start';
    $pauseBtn.classList.toggle('running', running);
    if (running) {
      $pauseInfo.textContent = `läuft seit ${clock(new Date(pauseStart))}`;
    } else if (lastPause) {
      $pauseInfo.textContent =
        `zuletzt ${clock(new Date(lastPause.start))}–${clock(new Date(lastPause.stop))} (+${fmt(lastPause.mins)})`;
    } else {
      $pauseInfo.textContent = '';
    }
  }

  function togglePause() {
    const now = Date.now();
    if (pauseStart === null) {
      pauseStart = now;                                   // Pause_Start
    } else {
      const pauseStop = now;                              // Pause_Stopp
      const mins = Math.max(0, Math.round((pauseStop - pauseStart) / 60000));
      const current = parseDuration($pause.value);
      const base = pauseMeasured && current !== null ? current : 0;
      $pause.value = fmt(base + mins);
      lastPause = { start: pauseStart, stop: pauseStop, mins };
      pauseMeasured = true;
      pauseStart = null;
      calc();
    }
    renderPause();
    save();
  }

  function normalize(input) {
    const v = parseDuration(input.value);
    if (v !== null) input.value = fmt(v);
  }

  function reset() {
    $arrival.value = nowHHMM();
    $work.value = DEFAULT_WORK;
    $pause.value = DEFAULT_PAUSE;
    pauseStart = null;
    lastPause = null;
    pauseMeasured = false;
    renderPause();
    save();
    calc();
  }

  // ---------- Wochenübersicht ----------
  // Gespeichert: { week: 'YYYY-MM-DD' (Montag), days: { 1..5: Bilanz in Minuten } }
  const WEEK_KEY = 'arbeitszeitrechner-woche';
  const $weekSum = document.getElementById('weekSum');
  const $sumRow = document.getElementById('sumRow');
  let week = null;

  const fmtSigned = m => m === 0 ? '0:00' : (m > 0 ? '+' : '−') + fmt(Math.abs(m));
  const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const mondayOf = d => dateKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7));
  const setSign = (el, v) => {
    el.classList.toggle('plus', v > 0);
    el.classList.toggle('minus', v < 0);
  };

  // "+0:15", "-0:30", "−1:05", "0:10" -> Minuten; ungültig -> null
  function parseSigned(str) {
    const m = /^([+\-−]?)\s*(\S.*)$/.exec(str.trim());
    if (!m) return null;
    const v = parseDuration(m[2]);
    if (v === null) return null;
    return m[1] && m[1] !== '+' ? -v : v;
  }

  function saveWeek() {
    try { localStorage.setItem(WEEK_KEY, JSON.stringify(week)); } catch {}
  }

  // Neue Woche oder Wochenende -> Einträge verwerfen
  function checkWeek() {
    const now = new Date();
    const monday = mondayOf(now);
    const weekend = now.getDay() === 0 || now.getDay() === 6;
    if (!week || !week.days || week.week !== monday || (weekend && Object.keys(week.days).length)) {
      week = { week: monday, days: {} };
      saveWeek();
      renderWeek();
    }
  }

  const weekInputs = {};
  for (let i = 1; i <= 5; i++) {
    $sumRow.insertAdjacentHTML('beforebegin', `
      <div class="row">
        <label class="idx" for="day${i}">${i}</label>
        <input id="day${i}" type="text" autocomplete="off" placeholder="–">
      </div>`);
    const inp = document.getElementById(`day${i}`);
    weekInputs[i] = inp;
    inp.addEventListener('input', () => {
      const s = inp.value.trim();
      if (s === '') {
        delete week.days[i];
      } else {
        const v = parseSigned(s);
        if (v === null) { inp.classList.add('invalid'); return; }
        week.days[i] = v;
      }
      inp.classList.remove('invalid');
      setSign(inp, week.days[i] ?? 0);
      saveWeek();
      renderSum();
    });
    inp.addEventListener('blur', renderWeek);   // normalisieren, Ungültiges verwerfen
    inp.addEventListener('focus', () => inp.select());
  }

  function renderSum() {
    const sum = Object.values(week.days).reduce((s, v) => s + v, 0);
    $weekSum.textContent = fmtSigned(sum);
    setSign($weekSum, sum);
  }

  function renderWeek() {
    if (!week) return;
    for (let i = 1; i <= 5; i++) {
      const inp = weekInputs[i];
      const v = week.days[i];
      if (document.activeElement !== inp) inp.value = v === undefined ? '' : fmtSigned(v);
      inp.classList.remove('invalid');
      setSign(inp, v ?? 0);
    }
    renderSum();
  }

  function resetWeek() {
    if (!confirm('Alle Einträge der Woche löschen?')) return;
    week = { week: mondayOf(new Date()), days: {} };
    saveWeek();
    renderWeek();
  }

  function checkOut() {
    if (pauseStart !== null) togglePause();   // laufende Pause beenden und einrechnen
    calc();
    if (leaveTotal === null) return;
    const now = new Date();
    const { n, crossed } = minutesNow(now);
    const day = new Date(now);
    if (crossed) day.setDate(day.getDate() - 1);   // Arbeitstag = Ankunftstag
    const idx = day.getDay();
    if (idx === 0 || idx === 6) {
      $diniSub.textContent = `Wochenende – nichts eingetragen · Stand ${clock(now)}`;
      return;
    }
    checkWeek();
    const bal = n - leaveTotal;
    week.days[idx] = bal;
    saveWeek();
    renderWeek();
    $diniSub.textContent = `Check-out: ${fmtSigned(bal)} für Tag ${idx} eingetragen`;
  }

  // ---------- Reiter ----------
  const $tabToday = document.getElementById('tabToday');
  const $tabWeek = document.getElementById('tabWeek');
  function showTab(isWeek) {
    $tabToday.setAttribute('aria-selected', String(!isWeek));
    $tabWeek.setAttribute('aria-selected', String(isWeek));
    document.getElementById('pageToday').hidden = isWeek;
    document.getElementById('pageWeek').hidden = !isWeek;
    if (isWeek) { checkWeek(); renderWeek(); } else updateDini();
  }

  // Dini als Pixel-Art zeichnen: o = Körper, d = Flecken, e = Auge
  const DINI = [
    '............ooo...',
    '............oeoo..',
    '............oooo..',
    '............oo....',
    '...........oo.....',
    '...........oo.....',
    '......ooooooo.....',
    '....odoodoooooo...',
    '..ooooooooooooo...',
    '.oo.oooooooooo....',
    'oo...oo....oo.....',
    '.....oo....oo.....'
  ];
  const DINI_COLORS = { o: '#e8833a', d: '#b85a1c', e: '#1b1f24' };
  document.getElementById('diniIcon').innerHTML = DINI.flatMap((line, y) =>
    [...line].map((c, x) => DINI_COLORS[c]
      ? `<rect x="${x}" y="${y}" width="1" height="1" fill="${DINI_COLORS[c]}"/>` : '')
  ).join('');

  // Start
  try { week = JSON.parse(localStorage.getItem(WEEK_KEY)) || null; } catch { week = null; }
  checkWeek();
  renderWeek();

  const saved = load();
  if (saved) {
    $arrival.value = saved.arrival || nowHHMM();
    $work.value = saved.work || DEFAULT_WORK;
    $pause.value = saved.pause || DEFAULT_PAUSE;
    pauseStart = saved.pauseStart ?? null;
    lastPause = saved.lastPause ?? null;
    pauseMeasured = !!saved.pauseMeasured;
    renderPause();
    calc();
  } else {
    reset();
  }

  for (const el of [$arrival, $work, $pause]) {
    el.addEventListener('input', () => { calc(); save(); });
  }
  for (const el of [$work, $pause]) {
    el.addEventListener('blur', () => { normalize(el); save(); });
    el.addEventListener('focus', () => el.select());
  }
  $pauseBtn.addEventListener('click', togglePause);
  document.getElementById('checkout').addEventListener('click', checkOut);
  document.getElementById('reset').addEventListener('click', reset);
  document.getElementById('weekReset').addEventListener('click', resetWeek);
  $tabToday.addEventListener('click', () => showTab(false));
  $tabWeek.addEventListener('click', () => showTab(true));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    checkWeek();
    updateDini();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
